# Generates the contribution-graph snake animation shown at the bottom of README.md.
# Output is published to the "output" branch, which README.md links to.

name: Generate Snake

on:
  # Twice a day is plenty - the contribution grid does not change faster than that.
  schedule:
    - cron: "0 */12 * * *"
  # Lets us run it by hand from the Actions tab.
  workflow_dispatch:
  # Keeps the scheduled job from being auto-disabled after 60 days of inactivity.
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Generates a light and a dark variant so the README looks right in both themes.
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Pushes dist/ to the "output" branch, keeping main free of generated files.
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
